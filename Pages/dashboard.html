<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eolo-Time | Dashboard</title>
    <!-- Favicono -->
    <link rel="icon" type="image/x-icon" href="../assets/Favicono.ico">
    <!-- Estilos -->
    <link rel="stylesheet" href="../Boostrap/Icons/bootstrap-icons.css">
    <link rel="stylesheet" href="../Boostrap/CSS/bootstrap.min.css">
    <link rel="stylesheet" href="../Styles/estilosBase.css">
    <link rel="stylesheet" href="../Styles/dashboardStyles.css">
</head>

<body>
    <!-- *Cabecera* -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
        <div class="navbar-brand">
            <img src="../assets/Logo.png" alt="Eolo-Time" width="70" height="60" class="d-inline-block imgLogo">
            <span class="d-inline-block">Eolo-Time</span>
        </div>
        <div class="ms-auto">
            <a href = "../index.html" id="volver" class="badge back-buttom"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
        </div>
        </div>
    </nav>

    <!-- *Spinner* -->
    <div class="d-flex justify-content-center text-center align-items-center w-100 h-100 position-absolute" style="top: 0; left: 0;" id = "capaSpinner">
        <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;" id = "spinner">
            <span class="visually-hidden">...</span>
        </div>
    </div>

    <!-- *Body* -->
    <div class="container d-none" id = "contenido-principal">
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="d-flex align-items-center">
                    <img id="icono-clima" class="display-3 me-3" style="width: 80px;" alt="Clima">
                    <!-- <i class="bi bi-cloud-sun display-3 me-3"></i> -->
                    <div class="text-start">
                        <h3 class="mb-0 text-capitalize" id = "descrip"></h3>
                        <span id = "pop"></span>
                    </div>
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <h1 class="display-4 fw-bold"><span id = "ciudad"></span>, <span id = "pais"></span></h1>
                <p class="lead"><i class="bi bi-calendar3"></i> <span id="fecha" class = "text-capitalize">Lunes, 1 de enero</span> | <span id="reloj">00:00</span></p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="glass-card text-center d-flex flex-column justify-content-center">
                            <p class="text-uppercase tracking-wider mb-0">Temperatura Actual</p>
                            <h2 class="temp-main"><span id = "temp-main"></span>°C</h2>
                            <p class="fs-5">
                                <span class="text-info"><i class="bi bi-arrow-down"></i><span id = "temp-min"></span>°C</span> |
                                <span class="text-danger"><i class="bi bi-arrow-up"></i><span id = "temp-max"></span>°C</span>
                            </p>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="glass-card">
                            <div class="row g-3">
                                <div class="col-6">
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-thermometer-half detail-icon me-2"></i>
                                        <div>
                                            <small class="d-block text-white-50">Sensación</small>
                                            <strong id = "sensacion"></strong>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-droplet-fill detail-icon me-2"></i>
                                        <div>
                                            <small class="d-block text-white-50">Humedad</small>
                                            <strong id = "humedad"></strong>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-wind detail-icon me-2"></i>
                                        <div>
                                            <small class="d-block text-white-50">Viento</small>
                                            <strong id = "vel-viento"></strong>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-speedometer detail-icon me-2"></i>
                                        <div>
                                            <small class="d-block text-white-50">Presión</small>
                                            <strong id = "presion"></strong>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-eye detail-icon me-2"></i>
                                        <div>
                                            <small class="d-block text-white-50">Visibilidad</small>
                                            <strong id = "visibilidad"></strong>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-sun detail-icon me-2"></i>
                                        <div>
                                            <small class="d-block text-white-50">Índice UV</small>
                                            <strong id = "indice_uv"></strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="glass-card">
                            <h5 class="mb-4"><i class="bi bi-clock"></i> Próximas 24 horas en bloques de 3 horas</h5>
                            <div class="scroll-x" id = "pronostico-horas">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="glass-card">
                    <h5 class="mb-4"><i class="bi bi-calendar-week"></i> Próximos Días</h5>
                    <div id = "pronostico-dias">

                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class = "container">
        <h5 class = "small">Datos proporcionados por OpenWeather</h5>
    </footer>

    <script src = "../Boostrap/JS/bootstrap.bundle.min.js"></script>
    <script src = "../Code/dashboardCode.js"></script>
    <script>
        actualizarFecha();
        setInterval(actualizarFecha, 1000);
    </script>
</body>

</html>
