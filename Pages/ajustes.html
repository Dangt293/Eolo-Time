<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eolo-Time | Ajustes</title>
    <!-- Favicono -->
    <link rel="icon" type="image/x-icon" href="../assets/Favicono.ico">
    <!-- Estilos -->
    <link rel="stylesheet" href="../Boostrap/Icons/bootstrap-icons.css">
    <link rel="stylesheet" href="../Boostrap/CSS/bootstrap.min.css">
    <link rel="stylesheet" href="../Styles/estilosBase.css">
    <link rel="stylesheet" href="../Styles/ajustesStyles.css">
</head>

<body>
    <!-- *Cabecera* -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid px-4">
        <div class="navbar-brand">
            <img src="../assets/Logo.png" alt="Eolo-Time" width="70" height="60" class="d-inline-block imgLogo">
            <span class="d-inline-block">Eolo-Time</span>
        </div>
        <div class="ms-auto">
            <a href = "../index.html" id="volver" class="badge back-buttom"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
        </div>
        </div>
    </nav>

    <!-- *Body* -->
    <div class="card text-white border-primary mt-3 mx-3 mx-md-5">
        <div class="card-body apiKeyCard">
            <h5 class="card-title mb-3"><i class="bi bi-key-fill"></i> Configuración de OpenWeather API</h5>
            
            <div class="mb-3">
                <label for="inputApiKey" class="form-label">API Key</label>
                <div class="input-group">
                    <!-- Censurada por defecto -->
                    <input type="password" class="form-control bg-secondary text-white border-secondary" id="inputApiKey" value="12345abcdeMockKeyOpenWeather" placeholder="Introduce tu API Key">
                    
                    <!-- Botón para descensurar / censurar -->
                    <button class="btn btn-outline-light" type="button" id="btnToggleVer" title="Mostrar/Ocultar API Key">
                        <i class="bi bi-eye" id="iconoOjo"></i>
                    </button>
                </div>
                <div class="form-text text-white">Tu clave se utiliza para realizar las peticiones al servicio de OpenWeather y quedara guardada únicamente de manera local en tu dispositivo.</div>
            </div>

            <!-- Botón de acción -->
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary" id="btnGuardarApiKey">
                    <i class="bi bi-save"></i> Guardar Nueva API Key
                </button>
            </div>
        </div>
    </div>

    <script src = "Boostrap/JS/bootstrap.bundle.min.js"></script>
    <script src ="../Code/ajustesCode.js"></script>
</body>
