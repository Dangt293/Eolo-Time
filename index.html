<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eolo-Time | Inicio</title>
  <!-- Favicono -->
  <link rel="icon" type="image/x-icon" href="assets/Favicono.ico">
  <!-- Estilos -->
  <link rel="stylesheet" href="Boostrap/Icons/bootstrap-icons.css">
  <link rel="stylesheet" href="Boostrap/CSS/bootstrap.min.css">
  <link rel="stylesheet" href="Styles/estilosBase.css">
  <link rel="stylesheet" href="Styles/indexStyles.css">
</head>
<body>
  <!-- *Cabecera* -->
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid px-4">
      <div class="navbar-brand">
        <img src="assets/Logo.png" alt="Eolo-Time" width="70" height="60" class="d-inline-block imgLogo">
        <span class="d-inline-block">Eolo-Time</span>
      </div>
      <div class="ms-auto">
        <span id="reloj" class="badge glass-reloj">16:45 PM</span>
      </div>
      <div class="ms-2 ms-md-4 d-flex align-items-center">
        <a href="Pages/ajustes.html" class = "ajustes-link">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-gear-fill"
            viewBox="0 0 16 16" id="ajustes">
            <path
              d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z" />
          </svg>
        </a>
      </div>
    </div>
  </nav>

  <!-- *Body* -->
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="encabezado" id ="encabezado">Mis Ciudades</h2>
      <button class="btn btn-light rounded-pill" data-bs-toggle="modal" data-bs-target="#nuevaCiudadModal">
        <i class="bi bi-plus-lg"></i> Añadir Ciudad
      </button>
    </div>
  
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id = "ciudadesCards">      
    </div>
    <!--Bloque de aviso si no hay ciudades guardadas-->
    <div class="text-center py-5 my-4 rounded border-none d-none" id = "sinCiudades">
      <div class="card h-100 glass-card p-2 position-relative">
        <i class="bi bi-cloud-slash display-4 text-muted mb-3"></i>
        <h4 class="fw-bold mb-2">No hay ninguna ciudad guardada</h4>
        <p class="text-muted mb-0">Añade tu primera ciudad desde el panel de ajustes para ver el clima.</p>
      </div>
    </div>
  </div>
  <!-- *Footer* -->
  <footer class="py-2">
    <div class="container-fluid px-4 text-end small" id ="footer">
      Eolo-Time <span id="app-version"></span>
    </div>
  </footer>
  
  <!-- Modal -->
  <div class="modal fade" id="nuevaCiudadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">Buscar Ciudad</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="input-group mb-3">
            <input type="text" class="form-control border-secondary"
              placeholder="Ej: Londres, GB" id = "ciudadNueva">
            <button class="btn btn-primary" type="button" onclick="aniadirCiudad()">Buscar</button>
          </div>
          <small class="text-white-50 italic">Sugerencia: "Ciudad, Código ISO del país de dos dígitos" (El texto introducido debe cumplir el formato indicado para ser aceptado)</small>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Error-->
  <div class="modal fade" id="errorModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="errorModalLabel">Error</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
  
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-info" data-bs-dismiss="modal">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src = "Boostrap/JS/bootstrap.bundle.min.js"></script>
  <script src = "Code/fondoDinamico.js"></script>
  <script src = "Code/indexCode.js"></script>
  <script>
    comprobarApi();

    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    //Añadimos los atajos de teclado
    document.addEventListener("keydown", (e) => {
        // Comprobamos si el usuario pulsa la tecla Ctrl (o Cmd en Mac)
        if (e.ctrlKey || e.metaKey) {
            
            //Ctrl + N -> Abrir el modal de añadir nueva ciudad
            if (e.key === 'n' || e.key === 'N') {
                e.preventDefault(); // Evitamos que el navegador abra una ventana nueva
                
                const modalElemento = document.getElementById('nuevaCiudadModal');
                if (modalElemento) {
                    const modal = new bootstrap.Modal(modalElemento);
                    modal.show();
                    console.log("Atajo Ctrl + N detectado: Abriendo modal de ciudad");
                }
            }

            //Ctrl + C -> Ir a la página de ajustes
            if (e.key === 'c' || e.key === 'C') {
                e.preventDefault(); // Evitamos acciones por defecto
                
                // Redirigimos a la vista de ajustes
                window.location.href = 'Pages/ajustes.html'; 
                console.log("Atajo Ctrl + C detectado: Redirigiendo a ajustes");
            }
        }
    });
  </script>
</body>
</html>
